name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          ./scripts/package.ps1 -Version $version
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-job-runner-release
          path: artifacts/release/*
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $files = Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "Simple Job Runner $tag" --notes "Release artifacts for Simple Job Runner."
          }
